<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;user-select:none}
  /* 宠物本体锚在窗口右下角 */
  #anchor{position:absolute;right:0;bottom:0;width:192px;height:208px}
  #pet{display:block;width:192px;height:208px;cursor:grab}
  #pet:active{cursor:grabbing}

  /* ---------- 头顶常驻状态气泡 ---------- */
  #status{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);
    margin-bottom:9px;width:180px;box-sizing:border-box;padding:7px 11px 8px;
    border-radius:12px;color:#f4f7ff;z-index:6;pointer-events:none;
    font:11.5px/1.5 "Microsoft YaHei",sans-serif;letter-spacing:.02em;
    background:linear-gradient(160deg,rgba(19,28,54,.94),rgba(7,11,26,.97));
    border:1px solid rgba(126,152,255,.42);box-shadow:0 6px 18px rgba(2,6,23,.42)}
  /* 指向头顶的小尾巴：描边层 + 填充层两个三角叠出来 */
  #status::before{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-7px;
    width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;
    border-top:7px solid rgba(126,152,255,.42)}
  #status::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;
    width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;
    border-top:6px solid #0a0f22}
  #status .s-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  #status .s-row + .s-row{margin-top:3px}
  #status .s-k{color:#9fb0e8;font-size:11px;white-space:nowrap}
  #status .s-v{color:#f4f7ff;font-weight:700;font-size:11.5px;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  #status .s-v.warn{color:#f0c978}
  #status .s-v.hot{color:#ff958d}
  #status .s-v.dim{color:#6f7ead;font-weight:400}
  /* 互动消息模式：临时顶替状态内容 */
  #status.msg{padding:8px 12px}
  #status.msg::before,#status.msg::after{display:none}
  #status .s-msg{font-size:11.5px;color:#f4f7ff;text-align:center;line-height:1.45}
</style>
</head>
<body>
<div id="anchor">
  <canvas id="pet" width="192" height="208"></canvas>
  <div id="status"></div>
</div>
<script>
(function () {
  'use strict';
  var CELL_W = 192, CELL_H = 208;
  /* 雪碧图 1536x1872 = 8 列 x 9 行，行序 = pet.json tracks 键序：
     0 idle / 1 run-right / 2 run-left / 3 waving / 4 jumping /
     5 failed / 6 waiting / 7 running / 8 review */
  var TRACKS = {
    idle:    { row: 0, frames: 6, durations: [500, 500, 600, 500, 500, 600], loop: true },
    waiting: { row: 6, frames: 6, durations: [550, 550, 600, 550, 550, 600], loop: true },
    waving:  { row: 3, frames: 4, durations: [450, 450, 450, 450], loop: false },
    jumping: { row: 4, frames: 5, durations: [400, 400, 400, 450, 450], loop: false },
    failed:  { row: 5, frames: 8, durations: [550, 550, 550, 600, 650, 700, 550, 550], loop: false }
  };
  var QUIPS = [
    '咚——跳一下！', '氧气充满，继续潜～', '主人在叫我吗？', '咕噜咕噜～',
    '跃跃欲试！', '别担心，有我在～', '噗通噗通，心跳加速', '今天也要加油～',
    '被摸头了，很开心', '再戳一下试试呀'
  ];
  var quipIdx = 0;

  var img = new Image();
  img.src = '/pet-sprite.webp';
  var cv = document.getElementById('pet');
  var ctx = cv.getContext('2d');
  var track = 'idle', idx = 0, elapsed = 0, last = performance.now();
  var idleCycles = 0, hover = false, monthlyPercent = 0;

  var T = window.__TAURI__ || null;
  function win(label) {
    try {
      var ns = T && (T.webviewWindow || T.window);
      if (ns && ns.WebviewWindow) return ns.WebviewWindow.getByLabel(label);
    } catch (e) { }
    return null;
  }

  function setTrack(name, force) {
    if (!force && track === name) return;
    if (!TRACKS[name]) return;
    track = name; idx = 0; elapsed = 0;
  }

  function draw() {
    var t = TRACKS[track];
    ctx.clearRect(0, 0, CELL_W, CELL_H);
    if (img.complete && img.naturalWidth) {
      ctx.drawImage(img, idx * CELL_W, t.row * CELL_H, CELL_W, CELL_H, 0, 0, CELL_W, CELL_H);
    }
  }

  function tick() {
    var now = performance.now();
    var delta = now - last;
    last = now;
    elapsed += delta;
    var t = TRACKS[track];
    if (elapsed >= (t.durations[idx] || 300)) {
      elapsed = 0;
      idx++;
      if (idx >= t.frames) {
        if (track === 'idle') {
          idleCycles++;
          idx = 0;
          if (hover) setTrack('waiting', true);
          else if (idleCycles % 4 === 3) setTrack('waving', true);
          else if (monthlyPercent >= 90 && idleCycles % 6 === 5) setTrack('failed', true);
        } else if (t.loop) {
          idx = 0;
        } else {
          setTrack('idle', true);
        }
      }
    }
    draw();
    requestAnimationFrame(tick);
  }
  img.onload = function () { draw(); requestAnimationFrame(tick); };
  draw();

  /* ---------------- 头顶常驻气泡 ---------------- */
  var statusEl = document.getElementById('status');
  var SD = { goMonth: null, goRoll: null, goWeek: null, ds: null, dsAvail: null };
  var msgToken = 0, msgTimer = null;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function pctClass(p) { return p >= 90 ? ' hot' : (p >= 70 ? ' warn' : ''); }
  function dsClass(v) { return v === null ? ' dim' : (v < 5 ? ' hot' : (v < 20 ? ' warn' : '')); }

  function applyStatus() {
    if (statusEl.classList.contains('msg')) return;   // 消息展示中，结束后再回落
    var goTxt, goCls;
    if (SD.goMonth === null) { goTxt = '—'; goCls = ' dim'; }
    else { goTxt = '余 ' + (100 - SD.goMonth) + '%'; goCls = pctClass(SD.goMonth); }
    var dsTxt = (SD.ds === null) ? '—' : ('¥ ' + SD.ds);
    statusEl.innerHTML =
      '<div class="s-row"><span class="s-k">Go 本月</span><span class="s-v' + goCls + '">' + goTxt + '</span></div>'
      + '<div class="s-row"><span class="s-k">DeepSeek</span><span class="s-v' + dsClass(SD.ds) + '">' + dsTxt + '</span></div>';
    var tip = [];
    if (SD.goRoll !== null) tip.push('Go 5h 已用 ' + SD.goRoll + '%');
    if (SD.goWeek !== null) tip.push('本周 ' + SD.goWeek + '%');
    if (SD.dsAvail !== null) tip.push(SD.dsAvail ? 'DeepSeek 账户正常' : 'DeepSeek 账户异常');
    statusEl.title = tip.join(' · ');
  }

  /* 互动消息：临时顶替状态内容，超时自动回落 */
  function showBubble(txt, ms) {
    var tok = ++msgToken;
    statusEl.classList.add('msg');
    statusEl.innerHTML = '<div class="s-msg">' + esc(txt) + '</div>';
    clearTimeout(msgTimer);
    msgTimer = setTimeout(function () {
      if (tok === msgToken) { statusEl.classList.remove('msg'); applyStatus(); }
    }, ms || 3800);
  }
  function quip() {
    showBubble(QUIPS[quipIdx % QUIPS.length]);
    quipIdx++;
  }

  function pullStatus() {
    fetch('/api/usage').then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.ok && d.usage) {
        var u = d.usage;
        if (u.monthly && typeof u.monthly.percent === 'number') { SD.goMonth = u.monthly.percent; monthlyPercent = SD.goMonth; }
        if (u.rolling && typeof u.rolling.percent === 'number') SD.goRoll = u.rolling.percent;
        if (u.weekly && typeof u.weekly.percent === 'number') SD.goWeek = u.weekly.percent;
      }
      applyStatus();
    }).catch(function () { applyStatus(); });
    fetch('/api/dshbalance').then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.ok && Array.isArray(d.balances) && d.balances.length) {
        var v = parseFloat(d.balances[0].total_balance);
        SD.ds = isNaN(v) ? null : v.toFixed(2);
        SD.dsAvail = !!d.isAvailable;
      }
      applyStatus();
    }).catch(function () { applyStatus(); });
  }
  applyStatus();
  setTimeout(pullStatus, 400);
  setInterval(pullStatus, 60000);

  /* ---------------- 互动：hover / 点击 / 拖拽 ---------------- */
  cv.addEventListener('mouseenter', function () { hover = true; if (track === 'idle') setTrack('waiting', true); });
  cv.addEventListener('mouseleave', function () { hover = false; if (track === 'waiting') setTrack('idle', true); });

  var dragging = null;
  cv.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    dragging = { x: e.clientX, y: e.clientY, moved: false };
  });
  window.addEventListener('mousemove', function (e) {
    if (!dragging || dragging.moved) return;
    var dx = e.clientX - dragging.x, dy = e.clientY - dragging.y;
    if (Math.sqrt(dx * dx + dy * dy) > 4) {
      dragging.moved = true;
      fetch('/api/pet/drag', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(function () { });
    }
  });
  window.addEventListener('mouseup', function (e) {
    if (dragging && !dragging.moved && e.button === 0) {
      setTrack('jumping', true);
      quip();
    }
    dragging = null;
  });
  cv.addEventListener('dblclick', function () {
    setTrack('waving', true);
    showBubble('收到～工作台见！');
    var w = win('main');
    if (w) { w.show(); w.setFocus(); }
  });

  /* ---------------- 右键 → 打开独立菜单窗 ---------------- */
  cv.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    fetch('/api/menu/open', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
      .catch(function () { });
  });
})();
</script>
</body>
</html>
