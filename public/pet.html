<!doctype html>
<!-- pet-ver: 2026-09-10-1605-interact-pool -->
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;user-select:none}
  /* 宠物本体锚在窗口右下角 */
  #anchor{position:absolute;right:0;bottom:0;width:192px;height:208px}
  #pet{display:block;width:192px;height:208px;cursor:grab}
  #pet:active{cursor:grabbing}

  /* ---------- 头顶常驻状态气泡 ---------- */
  #status{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);
    margin-bottom:9px;width:180px;box-sizing:border-box;padding:7px 11px 8px;
    border-radius:12px;color:#f4f7ff;z-index:6;pointer-events:none;
    font:11.5px/1.5 "Microsoft YaHei",sans-serif;letter-spacing:.02em;
    background:linear-gradient(160deg,rgba(19,28,54,.94),rgba(7,11,26,.97));
    border:1px solid rgba(126,152,255,.42);box-shadow:0 6px 18px rgba(2,6,23,.42)}
  /* 指向头顶的小尾巴：描边层 + 填充层两个三角叠出来 */
  #status::before{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-7px;
    width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;
    border-top:7px solid rgba(126,152,255,.42)}
  #status::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;
    width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;
    border-top:6px solid #0a0f22}
  #status .s-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  #status .s-row + .s-row{margin-top:3px}
  #status .s-k{color:#9fb0e8;font-size:11px;white-space:nowrap}
  #status .s-v{color:#f4f7ff;font-weight:700;font-size:11.5px;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  #status .s-v.warn{color:#f0c978}
  #status .s-v.hot{color:#ff958d}
  #status .s-v.dim{color:#6f7ead;font-weight:400}
  /* 互动消息模式：临时顶替状态内容 */
  #status.msg{padding:8px 12px}
  #status.msg::before,#status.msg::after{display:none}
  #status .s-msg{font-size:11.5px;color:#f4f7ff;text-align:center;line-height:1.45}
</style>
</head>
<body>
<div id="anchor">
  <canvas id="pet" width="192" height="208"></canvas>
  <div id="status"></div>
</div>
<script>
(function () {
  'use strict';
  var CELL_W = 192, CELL_H = 208;

  var T = window.__TAURI__ || null;
  function win(label) {
    try {
      var ns = T && (T.webviewWindow || T.window);
      if (ns && ns.WebviewWindow) return ns.WebviewWindow.getByLabel(label);
    } catch (e) { }
    return null;
  }

  /* ============ 契约默认值（清单读不到时的兜底，保证宠物永远能动） ============ */
  /* 行序固定：0 idle / 1 running-right / 2 running-left / 3 waving / 4 jumping /
     5 failed / 6 waiting / 7 running / 8 review */
  var CONTRACT_ORDER = ['idle', 'running-right', 'running-left', 'waving', 'jumping',
    'failed', 'waiting', 'running', 'review'];
  var DEFAULT_FRAMES = [6, 8, 8, 4, 5, 8, 6, 6, 6];
  var CONTRACT_MS = {
    'idle': [500, 500, 600, 500, 500, 600],
    'running-right': [300, 300, 300, 300, 300, 300, 300, 400],
    'running-left': [300, 300, 300, 300, 300, 300, 300, 400],
    'waving': [450, 450, 450, 450],
    'jumping': [400, 400, 400, 450, 450],
    'failed': [550, 550, 550, 600, 650, 700, 550, 550],
    'waiting': [550, 550, 600, 550, 550, 600],
    'running': [330, 330, 330, 330, 330, 400],
    'review': [650, 650, 650, 650, 650, 650]
  };

  /* ============ 把 pet.json 清单编成轨道表 ============ */
  /* 行号 = 该轨道在 sprite2d.tracks 里的键序（dsh-pet 约定）；
     也可用 tracks.<名>.row 显式指定，避免调序时行号错位。 */
  function buildTracks(manifest) {
    var s = manifest && manifest.sprite2d;
    var frames = (s && Array.isArray(s.frames) && s.frames.length) ? s.frames.slice() : DEFAULT_FRAMES.slice();
    var defs = (s && s.tracks && typeof s.tracks === 'object') ? s.tracks : null;
    var names = defs ? Object.keys(defs) : CONTRACT_ORDER.slice();
    var out = {};
    names.forEach(function (n, i) {
      var d = (defs && defs[n]) || {};
      var row = (typeof d.row === 'number') ? d.row : i;
      var fn = (typeof frames[row] === 'number') ? frames[row] : (DEFAULT_FRAMES[row] || 6);
      if (fn <= 0) return;                                   // 该行标记为未使用
      var durs = (Array.isArray(d.durations) && d.durations.length)
        ? d.durations.slice(0, fn) : (CONTRACT_MS[n] || []).slice(0, fn);
      while (durs.length < fn) durs.push(durs.length ? durs[durs.length - 1] : 300);
      var loop = (typeof d.loop === 'boolean') ? d.loop : (n !== 'jumping' && n !== 'failed');
      out[n] = { row: row, frames: fn, durations: durs, loop: loop };
    });
    return Object.keys(out).length ? out : null;
  }

  /* ============ 运行态 ============ */
  var TRACKS = buildTracks(null);      // 先用契约默认起步
  var BH = null, PARAMS = {};
  var QUIPS = ['咚——跳一下！', '氧气充满，继续潜～', '主人在叫我吗？', '咕噜咕噜～'];
  var quipIdx = 0;

  var cur = '', idx = 0, elapsed = 0, last = performance.now();
  var oneShot = false, queue = [];
  var ambientCycles = 0, hover = false;
  var dragDir = '', lastScreenX = null, dragDx = 0;
  var doingCount = 0, usagePct = null;

  function num(v, d) { return (typeof v === 'number' && isFinite(v)) ? v : d; }
  function param(k, d) { return num(PARAMS[k], d); }
  function hasTrack(n) { return !!(n && TRACKS[n]); }
  function trigCfg(key) {
    var t = BH && BH.triggers && BH.triggers[key];
    return (t && typeof t === 'object') ? t : {};
  }
  function trig(key) {
    var t = trigCfg(key);
    return (typeof t.track === 'string' && hasTrack(t.track)) ? t.track : '';
  }

  /* ============ 互动变化：台词池 / 点击轮换池 / 连点升级 ============ */
  /* 台词：优先用"动作专属台词"（cfg.quips[轨道名]），没有才回落到通用台词。
     同一个句子不连着说两遍。 */
  var lastQuip = '';
  function pickQuip(list, fallback) {
    var arr = (Array.isArray(list) ? list : []).filter(function (s) {
      return typeof s === 'string' && s;
    });
    if (!arr.length) return (typeof fallback === 'string' && fallback) ? fallback : '';
    if (arr.length === 1) { lastQuip = arr[0]; return arr[0]; }
    var pick = arr[Math.floor(Math.random() * arr.length)];
    if (pick === lastQuip) pick = arr[(arr.indexOf(pick) + 1) % arr.length];
    lastQuip = pick;
    return pick;
  }

  /* 左键轮换池：click.tracks 是候选动作数组，随机挑一个，
     且不与最近 avoidRepeat 次重复（默认 2）——避免连着出同一个动作。
     兼容旧写法 click.track（单值 = 只有一项的池）。 */
  var clickHist = [];
  function pickClickTrack() {
    var cfg = trigCfg('click');
    var pool = [];
    if (Array.isArray(cfg.tracks)) pool = cfg.tracks.filter(hasTrack);
    if (!pool.length) { var single = trig('click'); if (single) pool = [single]; }
    if (!pool.length) return '';
    if (pool.length === 1) return pool[0];
    var avoid = Math.max(0, Math.min(num(cfg.avoidRepeat, 2), pool.length - 1));
    var cand = pool.filter(function (n) { return clickHist.indexOf(n) < 0; });
    if (!cand.length) cand = pool.slice();
    var pick = cand[Math.floor(Math.random() * cand.length)];
    clickHist.push(pick);
    if (avoid <= 0) clickHist = [];
    else while (clickHist.length > avoid) clickHist.shift();
    return pick;
  }

  /* 连点升级：windowMs 内累计点满 every 次 → 返回 true（演"被戳烦了"）。
     触发后计数清零，避免后面每一下都演。 */
  var comboCount = 0, comboTimer = null;
  function comboFired() {
    var cfg = trigCfg('clickCombo');
    var every = num(cfg.every, 0);
    if (every <= 0 || !hasTrack(cfg.track)) return false;
    comboCount++;
    clearTimeout(comboTimer);
    comboTimer = setTimeout(function () { comboCount = 0; }, num(cfg.windowMs, 2500));
    if (comboCount >= every) { comboCount = 0; clearTimeout(comboTimer); return true; }
    return false;
  }

  function startTrack(name, once) {
    if (!hasTrack(name)) name = hasTrack('idle') ? 'idle' : Object.keys(TRACKS)[0];
    if (!name) return;
    cur = name; oneShot = !!once; idx = 0; elapsed = 0;
  }

  /* 常态该播什么：拖拽中 > 有任务在跑 > 悬停 > 待机 */
  function restTrack() {
    if (dragDir) {
      var d = trig(dragDir === 'left' ? 'dragLeft' : 'dragRight');
      if (d) return d;
    }
    var w = trig('agentWorking');
    if (w && doingCount > 0) return w;
    var h = trig('hover');
    if (h && hover) return h;
    return hasTrack('idle') ? 'idle' : Object.keys(TRACKS)[0];
  }
  function toRest() { oneShot = false; startTrack(restTrack(), false); }
  function refreshAmbient() {                // 环境态变了就切；正在播一次性动作时不动
    if (oneShot) return;
    var r = restTrack();
    if (r && r !== cur) startTrack(r, false);
  }

  /* 一次动作播完 / 环境态循环一圈结束时调用 */
  function onTrackEnd() {
    if (queue.length) { startTrack(queue.shift(), true); return; }
    if (oneShot) { oneShot = false; startTrack(restTrack(), false); return; }
    /* 环境态每跑完一圈算一拍（不限于 idle）——
       否则只要一直有任务在进行（agentWorking 常驻），溜达/告警就永远轮不到 */
    ambientCycles++;
    var thr = param('usageAlertThreshold', 90);
    var alertEvery = param('usageAlertEveryIdleCycles', 6);
    var alert = trig('usageAlert');
    if (alert && usagePct !== null && usagePct >= thr && alertEvery > 0 && ambientCycles % alertEvery === 0) {
      startTrack(alert, true); return;
    }
    var wanderEvery = param('wanderEveryIdleCycles', 9);
    var a = trig('dragRight'), b = trig('dragLeft');
    if (a && b && wanderEvery > 0 && ambientCycles % wanderEvery === 0) {
      queue = [b]; startTrack(a, true); return;   // 先向右溜达一小段，再向左
    }
    var nr = restTrack();
    if (nr && nr !== cur) startTrack(nr, false);
    else { idx = 0; elapsed = 0; }
  }

  /* ============ 绘制 ============ */
  var img = new Image();
  img.src = '/pet-sprite.webp';
  var cv = document.getElementById('pet');
  var ctx = cv.getContext('2d');

  function draw() {
    var t = TRACKS[cur];
    ctx.clearRect(0, 0, CELL_W, CELL_H);
    if (t && img.complete && img.naturalWidth) {
      var row = t.row, f = idx;
      // 兜底：清单声明的行超出图集实际高度时（图集还没同步升级），回落 idle 行，
      // 否则 drawImage 取越界 sy 什么也画不出，宠物会整只消失。
      if ((row + 1) * CELL_H > img.naturalHeight) {
        row = 0;
        f = f % Math.max(1, (TRACKS.idle && TRACKS.idle.frames) || 1);
      }
      ctx.drawImage(img, f * CELL_W, row * CELL_H, CELL_W, CELL_H, 0, 0, CELL_W, CELL_H);
    }
  }

  function tick() {
    var now = performance.now();
    elapsed += now - last;
    last = now;
    var t = TRACKS[cur];
    if (t && elapsed >= (t.durations[idx] || 300)) {
      elapsed = 0;
      idx++;
      if (idx >= t.frames) { idx = 0; onTrackEnd(); }
    }
    draw();
    requestAnimationFrame(tick);
  }

  /* ============ 头顶常驻气泡 ============ */
  var statusEl = document.getElementById('status');
  var SD = { goMonth: null, goRoll: null, goWeek: null, ds: null, dsAvail: null };
  var msgToken = 0, msgTimer = null;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function pctClass(p) { return p >= 90 ? ' hot' : (p >= 70 ? ' warn' : ''); }
  function dsClass(v) { return v === null ? ' dim' : (v < 5 ? ' hot' : (v < 20 ? ' warn' : '')); }

  function applyStatus() {
    if (statusEl.classList.contains('msg')) return;
    var goTxt, goCls;
    if (SD.goMonth === null) { goTxt = '—'; goCls = ' dim'; }
    else { goTxt = '余 ' + (100 - SD.goMonth) + '%'; goCls = pctClass(SD.goMonth); }
    var dsTxt = (SD.ds === null) ? '—' : ('¥ ' + SD.ds);
    statusEl.innerHTML =
      '<div class="s-row"><span class="s-k">Go 本月</span><span class="s-v' + goCls + '">' + goTxt + '</span></div>'
      + '<div class="s-row"><span class="s-k">DeepSeek</span><span class="s-v' + dsClass(SD.ds) + '">' + dsTxt + '</span></div>';
    var tip = [];
    if (SD.goRoll !== null) tip.push('Go 5h 已用 ' + SD.goRoll + '%');
    if (SD.goWeek !== null) tip.push('本周 ' + SD.goWeek + '%');
    if (doingCount > 0) tip.push('进行中任务 ' + doingCount + ' 个');
    if (SD.dsAvail !== null) tip.push(SD.dsAvail ? 'DeepSeek 账户正常' : 'DeepSeek 账户异常');
    statusEl.title = tip.join(' · ');
  }
  function showBubble(txt, ms) {
    var tok = ++msgToken;
    statusEl.classList.add('msg');
    statusEl.innerHTML = '<div class="s-msg">' + esc(txt) + '</div>';
    clearTimeout(msgTimer);
    msgTimer = setTimeout(function () {
      if (tok === msgToken) { statusEl.classList.remove('msg'); applyStatus(); }
    }, ms || 3800);
  }
  function quip() {
    if (!QUIPS.length) return;
    showBubble(QUIPS[quipIdx % QUIPS.length]);
    quipIdx++;
  }

  /* ============ 数据轮询 ============ */
  function pullStatus() {
    fetch('/api/usage').then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.ok && d.usage) {
        var u = d.usage;
        if (u.monthly && typeof u.monthly.percent === 'number') { SD.goMonth = u.monthly.percent; usagePct = SD.goMonth; }
        if (u.rolling && typeof u.rolling.percent === 'number') SD.goRoll = u.rolling.percent;
        if (u.weekly && typeof u.weekly.percent === 'number') SD.goWeek = u.weekly.percent;
      }
      applyStatus();
    }).catch(function () { applyStatus(); });
    fetch('/api/dshbalance').then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.ok && Array.isArray(d.balances) && d.balances.length) {
        var v = parseFloat(d.balances[0].total_balance);
        SD.ds = isNaN(v) ? null : v.toFixed(2);
        SD.dsAvail = !!d.isAvailable;
      }
      applyStatus();
    }).catch(function () { applyStatus(); });
  }

  /* 有任务在进行 → agentWorking；进行中数量下降 → taskFinished */
  function pullTasks() {
    fetch('/api/state').then(function (r) { return r.json(); }).then(function (d) {
      var tasks = (d && d.tasks) || [], doing = 0;
      for (var i = 0; i < tasks.length; i++) {
        if (tasks[i] && tasks[i].status === 'doing') doing++;
      }
      var finished = (doingCount > 0 && doing < doingCount);
      doingCount = doing;
      if (finished) {
        var name = trig('taskFinished');
        if (name) {
          startTrack(name, true);
          var cfg = trigCfg('taskFinished');
          if (cfg.bubble) showBubble(cfg.bubble);
        }
      } else {
        refreshAmbient();
      }
      applyStatus();
    }).catch(function () { });
  }

  /* ============ 清单与行为配置：热加载，改完重启应用即生效 ============ */
  function loadConfig() {
    return fetch('/pet.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (m) {
        var t = buildTracks(m);
        if (t) { TRACKS = t; if (!hasTrack(cur)) cur = ''; }
      })
      .catch(function () { })
      .then(function () {
        return fetch('/pet-behavior.json', { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (b) {
            if (b && typeof b === 'object') {
              BH = b;
              PARAMS = (b.params && typeof b.params === 'object') ? b.params : {};
              if (Array.isArray(b.quips) && b.quips.length) {
                var q = b.quips.filter(function (s) { return typeof s === 'string'; });
                if (q.length) QUIPS = q;
              }
            }
          })
          .catch(function () { });
      })
      .then(function () { if (!cur) startTrack(restTrack(), false); });
  }

  /* ============ 互动 ============ */
  cv.addEventListener('mouseenter', function () { hover = true; refreshAmbient(); });
  cv.addEventListener('mouseleave', function () { hover = false; refreshAmbient(); });

  var dragging = null;
  var holdTimer = null, holdFired = false;
  cv.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    dragging = { x: e.clientX, y: e.clientY, moved: false };
    lastScreenX = null;
    holdFired = false;
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    /* 按住不动满 holdMs → 摸头（区别于单击：单击是松手时的短按） */
    var hc = trigCfg('hold');
    var hms = num(hc.holdMs, 800);
    if (hasTrack(hc.track) && hms > 0) {
      holdTimer = setTimeout(function () {
        holdTimer = null;
        if (!dragging || dragging.moved) return;      // 已经变成拖拽了，不算摸头
        holdFired = true;
        startTrack(hc.track, hc.once !== false);
        var q = pickQuip(hc.quips, hc.quip);
        if (q) showBubble(q);
      }, hms);
    }
  });
  window.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    if (!dragging.moved) {
      var dx = e.clientX - dragging.x, dy = e.clientY - dragging.y;
      if (Math.sqrt(dx * dx + dy * dy) <= 4) return;
      dragging.moved = true;
      if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }   // 变成拖拽 → 取消摸头
      fetch('/api/pet/drag', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(function () { });
    }
    /* 窗口跟着光标跑，clientX 几乎不变 → 用屏幕坐标差判断拖动方向 */
    dragDx = (lastScreenX === null) ? 0 : (e.screenX - lastScreenX);
    lastScreenX = e.screenX;
    if (dragDx <= -1) dragDir = 'left';
    else if (dragDx >= 1) dragDir = 'right';
    /* 拖拽是强交互：打断正在播的一次性动作与排队动作，立刻换成跑动 */
    var want = restTrack();
    if (want && want !== cur) { oneShot = false; queue = []; startTrack(want, false); }
  });
  window.addEventListener('mouseup', function (e) {
    var st = dragging;
    dragging = null; lastScreenX = null; dragDir = '';
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    var wasClick = !!(st && !st.moved && e.button === 0);
    if (holdFired) {                       // 摸头结束：松手就回常态
      holdFired = false;
      if (wasClick) { toRest(); return; }
    }
    if (wasClick) {
      if (comboFired()) {                  // 连点升级：被戳烦了
        var cc = trigCfg('clickCombo');
        startTrack(cc.track, cc.once !== false);
        var cq = pickQuip(cc.quips, cc.quip);
        if (cq) showBubble(cq);
        return;
      }
      var cfg = trigCfg('click');
      var n = pickClickTrack();            // 轮换池：每次点不一定同一个动作
      if (n) startTrack(n, !!cfg.once);
      var q = pickQuip(cfg.quips && cfg.quips[n], '');
      if (q) showBubble(q);
      else if (cfg.quip) quip();
      else if (cfg.bubble) showBubble(cfg.bubble);
    }
    if (!oneShot) toRest();
  });
  cv.addEventListener('dblclick', function () {
    var cfg = trigCfg('doubleClick');
    var n = trig('doubleClick');
    if (n) startTrack(n, !!cfg.once);
    showBubble(cfg.bubble || '收到～工作台见！');
    var w = win('main');
    if (w) { w.show(); w.setFocus(); }
  });

  /* ============ 右键 → 打开独立菜单窗 ============ */
  cv.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    fetch('/api/menu/open', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
      .catch(function () { });
  });

  /* ============ 页面自热重载 ============
     页面/配置都是运行时从磁盘读的（no-store），所以改完 public/ 下这三个文件
     不必重启应用。做法：启动时抓一份内容作基线，之后每 30s 比一次，
     任一文件变了就自己刷新。首轮只记基线、不比较（避免刚加载就误判成刷新）。 */
  var WATCH_FILES = ['/pet.html', '/pet.json', '/pet-behavior.json'];
  var liveSig = null, reloading = false;
  function sigOf(list) {
    return list.map(function (s) {
      return (typeof s === 'string') ? (s.length + '|' + s.slice(0, 120) + '|' + s.slice(-120)) : '?';
    }).join('');
  }
  function checkReload(isBaseline) {
    if (reloading) return;
    Promise.all(WATCH_FILES.map(function (u) {
      return fetch(u, { cache: 'no-store' })
        .then(function (r) { return (r && typeof r.text === 'function') ? r.text() : ''; })
        .catch(function () { return ''; });
    })).then(function (list) {
      if (!list.some(function (s) { return typeof s === 'string' && s; })) return;
      var sig = sigOf(list);
      if (isBaseline || liveSig === null) { liveSig = sig; return; }
      if (sig !== liveSig) { reloading = true; location.reload(); }
    }).catch(function () { });
  }
  checkReload(true);
  setInterval(function () { checkReload(false); }, 30000);

  /* ============ 启动 ============ */
  img.onload = function () { draw(); requestAnimationFrame(tick); };
  draw();
  startTrack('idle', false);

  loadConfig().then(function () {
    applyStatus();
    setTimeout(pullStatus, 300);
    setTimeout(pullTasks, 600);
    setInterval(pullStatus, param('statusPollMs', 60000));
    setInterval(pullTasks, param('taskPollMs', 10000));
  });
})();
</script>
</body>
</html>
