<!doctype html>
<!-- net-ver: 2026-09-18-02-anime -->
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;user-select:none}
  /* 窗口仍是 166x56：尾巴是横向伸出的，所以不占垂直空间 —— 无需重编译 */
  #wrap{position:absolute;left:0;top:0;width:166px;height:56px;cursor:pointer}
  /* overflow:visible 才能让阴影/抖动溢出 SVG 盒子而不被裁掉 */
  #wrap svg{display:block;overflow:visible}
  /* SVG 文字要用 fill（用 color 不生效） */
  .k{fill:#A9C4E8;font:11px "Microsoft YaHei",sans-serif;letter-spacing:.02em}
  .v{fill:#F7F4F0;font:500 12.5px "Microsoft YaHei",sans-serif;letter-spacing:.02em;
    font-variant-numeric:tabular-nums}
  .v.dim{fill:#6F7EAD;font-weight:400}
  .v.fast{fill:#5EE0C0}
  .hide{display:none}
</style>
</head>
<body>
<div id="wrap">
  <!-- 卡 136x44 饱满椭圆（两端全圆 r=22 + 上下缘微鼓）+ 左侧锥形曲线尾（朝宠物） -->
  <svg id="netSvg" viewBox="0 0 166 56" width="166" height="56" role="img">
    <title id="netTip"></title>
    <defs>
      <linearGradient id="netGA" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#1E3A6E"/><stop offset="1" stop-color="#0E1838"/>
      </linearGradient>
      <filter id="netInk" x="-16%" y="-34%" width="132%" height="176%">
        <feTurbulence type="fractalNoise" baseFrequency="0.022 0.03" numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="netSh" x="-22%" y="-46%" width="144%" height="196%">
        <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#060A20" flood-opacity="0.45"/>
      </filter>
    </defs>
    <g filter="url(#netSh)"><g filter="url(#netInk)">
      <path id="tailL" d="M30 20 C18 26 8 32 2 39 C10 38 20 36 30 34 Z"
            fill="#17305C" stroke="#4090D0" stroke-opacity="0.55" stroke-width="2" stroke-linejoin="round"/>
      <path id="tailR" class="hide" d="M138 20 C150 26 160 32 166 39 C158 38 148 36 138 34 Z"
            fill="#17305C" stroke="#4090D0" stroke-opacity="0.55" stroke-width="2" stroke-linejoin="round"/>
      <path d="M38 2 C68 0 100 0 130 2 C142 2 152 12 152 24 C152 36 142 46 130 46
               C100 48 68 48 38 46 C26 46 16 36 16 24 C16 12 26 2 38 2 Z"
            fill="url(#netGA)" stroke="#4090D0" stroke-opacity="0.55" stroke-width="2" stroke-linejoin="round"/>
    </g></g>
    <!-- 月牙高光：沿内侧上缘的一道弧形笔触 -->
    <path d="M34 8 C54 3 84 2 106 5" fill="none" stroke="#F7F4F0" stroke-opacity="0.24"
          stroke-width="3" stroke-linecap="round"/>
    <!-- 弧形箭头：圆头曲线，取代带锐角的箭头字形 -->
    <g id="arrows" fill="none" stroke-width="1.8" stroke-linecap="round">
      <path d="M24 12 C25.4 14.4 25.4 17 24 19.6" stroke="#5AA9E6"/>
      <path d="M20.8 16.6 C22.5 18.7 25.5 18.7 27.2 16.6" stroke="#5AA9E6"/>
      <path d="M24 37 C25.4 34.6 25.4 32 24 29.4" stroke="#8FC4EE"/>
      <path d="M20.8 32.4 C22.5 30.3 25.5 30.3 27.2 32.4" stroke="#8FC4EE"/>
    </g>
    <text class="k" id="lb1" x="34" y="20">下行</text>
    <text class="v" id="vl1" x="144" y="20" text-anchor="end">—</text>
    <text class="k" id="lb2" x="34" y="36">上行</text>
    <text class="v" id="vl2" x="144" y="36" text-anchor="end">—</text>
  </svg>
</div>
<script>
(function () {
  'use strict';
  var K = 1024;
  var wrap = document.getElementById('wrap');
  var tip = document.getElementById('netTip');
  var arrows = document.getElementById('arrows');
  var tailL = document.getElementById('tailL');
  var tailR = document.getElementById('tailR');
  var lb1 = document.getElementById('lb1'), vl1 = document.getElementById('vl1');
  var lb2 = document.getElementById('lb2'), vl2 = document.getElementById('vl2');

  /* 值 → 文字。与 Rust 侧 fmt_speed 同口径（三位有效数字，防宽度跳动） */
  function fmt(bps) {
    if (!isFinite(bps) || bps < 0.5) return '0 K/s';
    if (bps < K) return Math.round(bps) + ' B/s';
    var kb = bps / K;
    if (kb < K) return Math.round(kb) + ' K/s';
    var mb = kb / K;
    return (mb < 100 ? mb.toFixed(2) : mb.toFixed(1)) + ' M/s';
  }
  function level(bps) {
    if (!isFinite(bps)) return ' dim';
    if (bps < 8 * K) return ' dim';
    return bps >= 5 * K * K ? ' fast' : '';
  }
  function setV(el, txt, cls) {
    el.textContent = txt;
    el.setAttribute('class', 'v' + cls);
  }

  /* 测试缝：给 devtools/net-fmt-test.cjs 用来锁定显示口径（与 Rust fmt_speed 必须一致） */
  window.__netFmt = fmt;
  window.__netLevel = level;

  /* 非对称 EMA：升快（0.5）降更快（0.7），否则下载结束后要好几秒才落到 0 */
  var emaD = null, emaU = null;
  function smooth(prev, raw) {
    if (prev === null) return raw;
    var a = raw > prev ? 0.5 : 0.7;
    return prev + a * (raw - prev);
  }

  var mode = 'total';                 // total | detail
  var lastD = null, lastU = null;

  function render(d) {
    // 翻到宠物左侧时尾巴要朝右
    var left = (d.side === 'left');
    tailL.setAttribute('class', left ? 'hide' : '');
    tailR.setAttribute('class', left ? '' : 'hide');

    if (mode === 'detail' && Array.isArray(d.ifaces) && d.ifaces.length) {
      arrows.setAttribute('class', 'hide');
      var a = d.ifaces[0], b = d.ifaces[1];
      setV(vl1, a ? fmt(a.down) : '—', a ? level(a.down) : ' dim');
      lb1.textContent = shortName(a);
      if (b) { setV(vl2, fmt(b.down), level(b.down)); lb2.textContent = shortName(b); }
      else { setV(vl2, '—', ' dim'); lb2.textContent = ''; }
      return;
    }
    arrows.setAttribute('class', '');
    lb1.textContent = '下行';
    lb2.textContent = '上行';
    var blank = d.stale || d.warm;
    setV(vl1, blank ? '—' : fmt(emaD === null ? d.down : emaD), blank ? ' dim' : level(emaD === null ? 0 : emaD));
    setV(vl2, blank ? '—' : fmt(emaU === null ? d.up : emaU), blank ? ' dim' : level(emaU === null ? 0 : emaU));
    if (tip) tip.textContent = '点击切换「总速 / 分网卡明细」· 每 ' + Math.round((d.sampleMs || 1000) / 1000) + ' 秒采样';
  }
  function shortName(x) {
    if (!x) return '';
    var s = String(x.name || '');
    return s.length > 4 ? s.slice(0, 4) : s;   // 卡片只有 136 宽，名字必须截断
  }

  function pull() {
    var url = (mode === 'detail') ? '/api/netspeed/detail' : '/api/netspeed';
    fetch(url, { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d || !d.ok) return;
      emaD = smooth(emaD, d.down);
      emaU = smooth(emaU, d.up);
      /* 变化 < 3% 就不重绘（防抖，避免数字每秒无意义地闪） */
      var changed = lastD === null || lastU === null || mode === 'detail'
        || Math.abs(emaD - lastD) > Math.max(1, lastD * 0.03)
        || Math.abs(emaU - lastU) > Math.max(1, lastU * 0.03)
        || d.stale || d.warm;
      if (changed) {
        lastD = emaD; lastU = emaU;
        render(d);
      }
    }).catch(function () {
      setV(vl1, '—', ' dim');
      setV(vl2, '—', ' dim');
    });
  }

  /* 点一下：总速 ↔ 分网卡明细（排障时一眼看出是哪张网卡在跑，VPN/TUN 双计数也藏不住） */
  wrap.addEventListener('click', function () {
    mode = (mode === 'total') ? 'detail' : 'total';
    emaD = null; emaU = null; lastD = null; lastU = null;
    pull();
  });

  /* 自热重载：改完 public/net.html 最多 30 秒自动生效，不用重启应用 */
  var liveSig = null, reloading = false;
  function checkReload(isBaseline) {
    if (reloading) return;
    fetch('/net.html', { cache: 'no-store' })
      .then(function (r) { return (r && typeof r.text === 'function') ? r.text() : ''; })
      .then(function (h) {
        if (typeof h !== 'string' || !h) return;
        var sig = h.length + '|' + h.slice(0, 120) + '|' + h.slice(-120);
        if (isBaseline || liveSig === null) { liveSig = sig; return; }
        if (sig !== liveSig) { reloading = true; location.reload(); }
      })
      .catch(function () { });
  }
  checkReload(true);
  setInterval(function () { checkReload(false); }, 30000);

  pull();
  setInterval(pull, 1000);
})();
</script>
</body>
</html>
